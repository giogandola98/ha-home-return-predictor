# Standalone "Home Return Predictor" dashboard (raw configuration).
# Settings -> Dashboards -> Add dashboard -> New dashboard from scratch -> open it ->
# pencil -> three dots -> Raw configuration editor -> replace everything with this file.
# Replace `PERSON_A` / `PERSON_B` with your person object ids
# (person.alice -> alice). The other entity ids are fixed by the integration.
title: Home Return Predictor
views:
  - title: Debug
    path: debug
    icon: mdi:bug
    cards:
      # ---------------------------------------------------------------- house
      - type: entities
        title: House
        state_color: true
        entities:
          - entity: binary_sensor.house_someone_returning
            name: Someone returning
          - entity: sensor.house_return_probability
            name: House return probability
          - entity: sensor.house_next_return_eta
            name: Next arrival
            format: time
          - type: attribute
            entity: sensor.house_return_probability
            attribute: away_probability
            name: Probability (away people only)
            suffix: "%"
          - type: attribute
            entity: sensor.house_return_probability
            attribute: occupied
            name: House occupied
          - type: attribute
            entity: sensor.house_return_probability
            attribute: mode
            name: House mode
      - type: markdown
        title: Blueprint candidates
        content: |
          {% set c = state_attr('sensor.house_next_return_eta', 'candidates') or [] %}
          {% if c | count == 0 %}No away person with probability ≥ 25%.{% else %}
          | Person | Prob. | ETA |
          |---|---|---|
          {% for x in c -%}
          | {{ state_attr(x.person, 'friendly_name') or x.person }} | {{ x.probability | round(0) }}% | {{ as_timestamp(x.eta) | timestamp_custom('%H:%M') if x.eta else '—' }} |
          {% endfor %}{% endif %}

          **Home:** {{ (state_attr('sensor.house_return_probability', 'persons_home') or []) | map('state_attr', 'friendly_name') | join(', ') or 'nobody' }}
          · **Returning:** {{ (state_attr('sensor.house_return_probability', 'returning_persons') or []) | map('state_attr', 'friendly_name') | join(', ') or 'nobody' }}

      # ------------------------------------------------------------- person A
      - type: entities
        title: PERSON_A
        state_color: true
        entities:
          - entity: person.PERSON_A
            name: Location
          - entity: select.PERSON_A_mode
            name: Mode (auto / learning / live)
          - entity: binary_sensor.PERSON_A_returning
            name: Returning
          - entity: sensor.PERSON_A_return_probability
            name: Return probability
          - entity: sensor.PERSON_A_return_eta
            name: ETA
            format: time
          - entity: sensor.PERSON_A_model_maturity
            name: Model maturity
          - type: attribute
            entity: binary_sensor.PERSON_A_returning
            attribute: mode
            name: Effective mode
          - type: attribute
            entity: binary_sensor.PERSON_A_returning
            attribute: advisory
            name: Advisory only
      - type: markdown
        title: PERSON_A — model details
        content: |
          {% set p = 'PERSON_A' %}
          {% set m = 'sensor.' ~ p ~ '_model_maturity' %}
          {% set r = 'binary_sensor.' ~ p ~ '_returning' %}
          **Reason:** {{ states('sensor.' ~ p ~ '_return_reason') }}

          | | |
          |---|---|
          | Habit prob. | {{ (state_attr(r, 'prior_probability') | float(0) * 100) | round(0) ~ "%" if state_attr(r, 'prior_probability') is not none else "—" }} |
          | LR GPS | {{ state_attr(r, 'likelihood_ratio') | float(1) | round(2) }} |
          | Approach speed | {{ state_attr(r, 'approach_speed_kmh') | float(0) | round(0) ~ ' km/h' if state_attr(r, 'approach_speed_kmh') is not none else '—' }} |
          | Distance | {{ state_attr(r, 'distance_km') | float(0) | round(1) ~ ' km' if state_attr(r, 'distance_km') is not none else '—' }} |
          | ETA habit / GPS | {{ as_timestamp(state_attr(r, 'eta_habit')) | timestamp_custom('%H:%M') if state_attr(r, 'eta_habit') else '—' }} / {{ as_timestamp(state_attr(r, 'eta_position')) | timestamp_custom('%H:%M') if state_attr(r, 'eta_position') else '—' }} |
          | Episodes (effective) | {{ state_attr(m, 'episodes') }} ({{ state_attr(m, 'effective_episodes') | float(0) | round(1) }}) |
          | Verified predictions | {{ state_attr(m, 'resolved_predictions') }} |
          | Brier model / baseline | {{ state_attr(m, 'brier_score') | float(0) | round(3) if state_attr(m, 'brier_score') is not none else '—' }} / {{ state_attr(m, 'baseline_brier_score') | float(0) | round(3) if state_attr(m, 'baseline_brier_score') is not none else '—' }} |
          | Brier skill score | {{ state_attr(m, 'brier_skill_score') | float(0) | round(2) if state_attr(m, 'brier_skill_score') is not none else '—' }} |
          | Active model | {{ state_attr(m, 'active_model') }} |
          | Challenger enabled / numpy | {{ state_attr(m, 'challenger_enabled') }} / {{ state_attr(m, 'numpy_available') if state_attr(m, 'numpy_available') is not none else state_attr(m, 'sklearn_available') }} |
          {% set cb = state_attr(m, 'candidate_brier') or {} %}{% for k, v in cb.items() %}| Brier {{ k }} | {{ v | round(3) if v is not none else '—' }} |
          {% endfor %}
      - type: history-graph
        title: PERSON_A — last 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.PERSON_A_return_probability
          - entity: sensor.PERSON_A_model_maturity
          - entity: binary_sensor.PERSON_A_returning
          - entity: person.PERSON_A

      # ------------------------------------------------------------- person B
      - type: entities
        title: PERSON_B
        state_color: true
        entities:
          - entity: person.PERSON_B
            name: Location
          - entity: select.PERSON_B_mode
            name: Mode (auto / learning / live)
          - entity: binary_sensor.PERSON_B_returning
            name: Returning
          - entity: sensor.PERSON_B_return_probability
            name: Return probability
          - entity: sensor.PERSON_B_return_eta
            name: ETA
            format: time
          - entity: sensor.PERSON_B_model_maturity
            name: Model maturity
          - type: attribute
            entity: binary_sensor.PERSON_B_returning
            attribute: mode
            name: Effective mode
          - type: attribute
            entity: binary_sensor.PERSON_B_returning
            attribute: advisory
            name: Advisory only
      - type: markdown
        title: PERSON_B — model details
        content: |
          {% set p = 'PERSON_B' %}
          {% set m = 'sensor.' ~ p ~ '_model_maturity' %}
          {% set r = 'binary_sensor.' ~ p ~ '_returning' %}
          **Reason:** {{ states('sensor.' ~ p ~ '_return_reason') }}

          | | |
          |---|---|
          | Habit prob. | {{ (state_attr(r, 'prior_probability') | float(0) * 100) | round(0) ~ "%" if state_attr(r, 'prior_probability') is not none else "—" }} |
          | LR GPS | {{ state_attr(r, 'likelihood_ratio') | float(1) | round(2) }} |
          | Approach speed | {{ state_attr(r, 'approach_speed_kmh') | float(0) | round(0) ~ ' km/h' if state_attr(r, 'approach_speed_kmh') is not none else '—' }} |
          | Distance | {{ state_attr(r, 'distance_km') | float(0) | round(1) ~ ' km' if state_attr(r, 'distance_km') is not none else '—' }} |
          | ETA habit / GPS | {{ as_timestamp(state_attr(r, 'eta_habit')) | timestamp_custom('%H:%M') if state_attr(r, 'eta_habit') else '—' }} / {{ as_timestamp(state_attr(r, 'eta_position')) | timestamp_custom('%H:%M') if state_attr(r, 'eta_position') else '—' }} |
          | Episodes (effective) | {{ state_attr(m, 'episodes') }} ({{ state_attr(m, 'effective_episodes') | float(0) | round(1) }}) |
          | Verified predictions | {{ state_attr(m, 'resolved_predictions') }} |
          | Brier model / baseline | {{ state_attr(m, 'brier_score') | float(0) | round(3) if state_attr(m, 'brier_score') is not none else '—' }} / {{ state_attr(m, 'baseline_brier_score') | float(0) | round(3) if state_attr(m, 'baseline_brier_score') is not none else '—' }} |
          | Brier skill score | {{ state_attr(m, 'brier_skill_score') | float(0) | round(2) if state_attr(m, 'brier_skill_score') is not none else '—' }} |
          | Active model | {{ state_attr(m, 'active_model') }} |
          | Challenger enabled / numpy | {{ state_attr(m, 'challenger_enabled') }} / {{ state_attr(m, 'numpy_available') if state_attr(m, 'numpy_available') is not none else state_attr(m, 'sklearn_available') }} |
          {% set cb = state_attr(m, 'candidate_brier') or {} %}{% for k, v in cb.items() %}| Brier {{ k }} | {{ v | round(3) if v is not none else '—' }} |
          {% endfor %}
      - type: history-graph
        title: PERSON_B — last 24 hours
        hours_to_show: 24
        entities:
          - entity: sensor.PERSON_B_return_probability
          - entity: sensor.PERSON_B_model_maturity
          - entity: binary_sensor.PERSON_B_returning
          - entity: person.PERSON_B

      # ------------------------------------------------------------- tools
      - type: grid
        title: Tools
        columns: 3
        square: false
        cards:
          - type: button
            name: Retrain (all)
            icon: mdi:database-refresh
            tap_action:
              action: perform-action
              perform_action: home_return_predictor.retrain
              confirmation:
                text: Re-read recorder history? (episodes already learnt are kept)
          - type: button
            name: Export diagnostics
            icon: mdi:file-export
            tap_action:
              action: perform-action
              perform_action: home_return_predictor.export_diagnostics
          - type: button
            name: Reset PERSON_A
            icon: mdi:restore-alert
            tap_action:
              action: perform-action
              perform_action: home_return_predictor.reset
              data:
                person: person.PERSON_A
              confirmation:
                text: Clear everything the model has learnt about PERSON_A?
          - type: button
            name: Reset PERSON_B
            icon: mdi:restore-alert
            tap_action:
              action: perform-action
              perform_action: home_return_predictor.reset
              data:
                person: person.PERSON_B
              confirmation:
                text: Clear everything the model has learnt about PERSON_B?
      - type: history-graph
        title: House — last 48 hours
        hours_to_show: 48
        entities:
          - entity: sensor.house_return_probability
          - entity: binary_sensor.house_someone_returning
